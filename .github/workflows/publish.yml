name: release

# Publish to npm when a version tag is pushed (v1.0.1, v1.1.0, ...).
#
# Requires the repository secret NPM_TOKEN (npm granular access token that may
# publish `dsh-web-update`). Until that secret exists, a tag run exits
# successfully with a "skipped" message instead of failing red.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Pack contents check
        run: npm pack --dry-run

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret is not configured; skipping npm publish."
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 0
          fi
          npm publish --provenance --access public
